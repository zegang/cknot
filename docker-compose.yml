services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes: # Mount a local directory to Redis data directory
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cknot-app:
    build: .
    env_file: .env
    environment:
      - REDIS_HOST=redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./.venv:/app/.venv # Map container's .venv to host's .venv
    ports:
      - "9999:9999"
    stdin_open: true
    tty: true